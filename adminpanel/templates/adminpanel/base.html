{% extends 'base.html' %}
{% load static %}

{% block link %}<link rel="stylesheet" href="{% static 'css/admin.css' %}">{% endblock %}

{% block content %}
<div class="admin-area">
  <div class="admin-page">
    <nav class="admin-topbar">
      <a href="{% url 'adminpanel:dashboard' %}" class="admin-brand"><span class="admin-brand-mark">Py</span> Панель управления</a>
      <div class="admin-nav"><a href="{% url 'adminpanel:dashboard' %}">Обзор</a><a href="{% url 'adminpanel:course_list' %}">Курсы</a></div>
      <div class="admin-user">
        {% if user.is_authenticated %}<a href="{% url 'users:profile' %}">Профиль</a><a href="{% url 'users:signout' %}">Выйти</a>{% else %}<a href="{% url 'users:signin' %}">Войти</a>{% endif %}
      </div>
    </nav>
    {% block admin_content %}{% endblock %}
  </div>
</div>
{% endblock %}
