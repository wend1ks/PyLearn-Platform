{% extends 'adminpanel/base.html' %}{% load widget_tweaks %}{% block admin_content %}<div class="admin-tabs"><a class="active" href="{% url 'adminpanel:edit_course' course.id %}">Настройки</a><a href="{% url 'adminpanel:course_modules' course.id %}">Модули</a><a href="{% url 'adminpanel:add_module' course.id %}">+ Модуль</a></div><div class="admin-header"><div><p class="admin-eyebrow">Курс</p><h1 class="admin-heading">Редактирование курса</h1></div></div><form method="post" class="admin-form">{% csrf_token %}{% for field in form %}<div class="admin-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field|add_class:"admin-input" }}{{ field.errors }}</div>{% endfor %}<div class="admin-form-actions"><button class="admin-button" type="submit">Сохранить</button><a class="admin-button secondary" href="{% url 'adminpanel:course_list' %}">Отмена</a><a class="admin-button danger" href="{% url 'adminpanel:delete_course' course.id %}" onclick="return confirm('Удалить курс?');">Удалить</a></div></form>{% endblock %}
